<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rime Voice 设置</title><style>
body{font:16px system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 20px;color:#202124}h1{font-size:24px}label{display:block;margin:20px 0 6px}input:not([type=checkbox]),select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #aaa;border-radius:6px;font:inherit}input[type=checkbox]{width:auto;margin-right:8px}button{margin-top:24px;padding:10px 20px;background:#1967d2;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}small{color:#666}#status{margin-left:12px}
</style></head><body><h1>Rime Voice 设置</h1><p>Shift 切换中英文；语音可按住右 Alt，或用 Alt+L 开始和结束。单次录音最多 10 分钟。</p><form><label>语音服务</label><select name="provider"><option value="MiMo">MiMo</option><option value="Gemini">Gemini 3.5 Transcribe</option></select><div id="gemini-fields" hidden><label>Google AI Studio API Key</label><input name="geminiApiKey" type="password" autocomplete="off"><label><input name="smartMode" type="checkbox"> Smart 模式：清理语气词、重复和口误</label><small>使用 gemini-3.5-transcribe 文件转写；关闭后按原话转写。</small></div><div id="mimo-fields"><h2 id="mimo-title">MiMo 设置</h2><label>MiMo API 地址</label><input name="endpoint" type="url"><small>完整的 HTTPS chat/completions 地址</small><label>MiMo 模型</label><input name="model"><label>MiMo API Key</label><input name="apiKey" type="password" autocomplete="off"></div><small>选择 Gemini 时，请同时保留 MiMo API Key；Gemini 不可用且 MiMo 可用时会自动使用 MiMo。</small><p>密钥只保存在本机扩展存储中。</p><div><button type="submit">保存</button><button type="button" id="microphone">授权麦克风</button><span id="status" role="status"></span></div></form><script type="module" src="options.js"></script></body></html>
